# Manuel prod — otomatik cron için schedule-poll.yml ve schedule-burst.yml kullan
name: Production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "poll | burst | burst-tuesday | burst-thursday | burst-saturday"
        required: false
        default: "poll"

jobs:
  poll:
    if: >-
      github.event.inputs.mode == 'poll' || github.event.inputs.mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Poll state cache
        uses: actions/cache@v4
        with:
          path: .poll_last_run
          key: poll-last-run-${{ github.repository }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Poll (Salı / Perşembe / Cumartesi)
        env:
          SUPERSAAS_EMAIL: ${{ secrets.SUPERSAAS_EMAIL }}
          SUPERSAAS_PASSWORD: ${{ secrets.SUPERSAAS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "1"
        run: python -m src.main --mode poll --slot all
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poll-screenshots
          path: screenshots/
          if-no-files-found: ignore

  burst:
    if: startsWith(github.event.inputs.mode, 'burst')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Hedef slot
        id: meta
        run: |
          SLOT="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.mode }}" in
              burst-tuesday) SLOT="tuesday" ;;
              burst-thursday) SLOT="thursday" ;;
              burst-saturday) SLOT="saturday" ;;
              burst) SLOT="all" ;;
            esac
          else
            case "${{ github.event.schedule }}" in
              "55 3 * * 5") SLOT="tuesday" ;;
              "55 3 * * 0") SLOT="thursday" ;;
              "55 4 * * 2") SLOT="saturday" ;;
            esac
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Burst rezervasyon
        env:
          SUPERSAAS_EMAIL: ${{ secrets.SUPERSAAS_EMAIL }}
          SUPERSAAS_PASSWORD: ${{ secrets.SUPERSAAS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "1"
        run: python -m src.main --mode burst --slot ${{ steps.meta.outputs.slot }}
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burst-screenshots
          path: screenshots/
          if-no-files-found: ignore
